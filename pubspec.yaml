name: alex_store
description: The Alex Store Android app. Reads the same catalog.json the website serves, with on-device semantic search from a native ternlight engine.
publish_to: "none"

# The app version and the versionCode are what appear in the About screen of
# Android and in the Play/F-Droid listing. Keep them in step with the release
# tag in the repo — MEMORY.md §6 uses the `latest` tag so the APK URL never
# changes, which means the version here is the only place a user-visible
# version number lives.
#
# Was 0.1.0+1, which matched nothing: the published release is tagged v1.0, so
# the APK's reported versionName disagreed with the release it came from. Same
# reason the build number is not bumped here — this is the v1.0 artifact being
# built properly (real key, R8), not a new version of it.
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # FFI primitives for the native ternlight engine: calloc/free for the
  # buffers Dart hands to Rust. The boundary itself is hand-written in
  # lib/src/services/native_engine.dart against rust/src/ffi.rs.
  #
  # flutter_rust_bridge used to be here. It was removed because its codegen
  # step needs `cargo expand`, hence a nightly toolchain, which this
  # environment cannot provide — see MEMORY.md §6. `ffi` is the whole of what
  # the hand-written boundary needs.
  ffi: ^2.1.0

  # Opens wa.me links. There is no in-app checkout (MEMORY.md §3), so this is
  # the only external navigation in the app.
  url_launcher: ^6.3.0

  # Read/write directory for the offline catalog copy. Injected into
  # CatalogService rather than imported directly, so the service stays testable
  # without a plugin binding.
  path_provider: ^2.1.4
  app_links: ^7.2.2

  # Plays the launch video (assets/splash/alex-store.mp4). The app has exactly
  # one video and one reason to have it: the splash. It brings ExoPlayer in on
  # Android, which is the whole cost of this dependency and the reason the APK
  # grew — see README. There is no second player anywhere in the app, and no
  # streaming, so none of ExoPlayer's other sources are used.
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Only so splash_test.dart can stand in for the native player. `video_player`
  # deliberately does not re-export VideoPlayerPlatform, VideoEvent or
  # VideoCreationOptions, so a fake cannot be written without naming this
  # package — and importing a transitive package directly is what
  # depend_on_referenced_packages exists to prevent. Test-only; nothing in lib/
  # refers to it.
  video_player_platform_interface: ^6.9.0

# NOTE: there is no codegen step any more.
#
# The bridge used to be flutter_rust_bridge, whose generator is a Rust binary
# needing `cargo install flutter_rust_bridge_codegen`. That in turn shells out
# to `cargo expand`, which needs a nightly toolchain this environment cannot
# provide. The boundary is now hand-written and paired: rust/src/ffi.rs and
# lib/src/services/native_engine.dart must be changed together.

flutter:
  uses-material-design: true

  # The launch video. Committed rather than fetched: a splash that has to
  # download before it can play is not a splash, and it has to work offline on
  # first run. 1.1 MB is the price of the shop's own opening title.
  #
  # The Remotion source that renders it lives outside this repo
  # (Remotion/src/compositions/AlexStore) — this is the published artifact of
  # that composition, and the same file the storefront advertises.
  assets:
    - assets/splash/

# Model weights are compiled into the native library by include_bytes!, not
# shipped as a Flutter asset. They are 4.6 MB of binary in an APK that is
# already large; putting them in assets/ as well would double them.