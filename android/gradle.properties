org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation cannot write its caches reliably when the
# project path contains spaces ("D:\GitHub Projects\alex-store-app"). It fails
# with "Could not close incremental caches ... class-fq-name-to-source.tab",
# which is a Kotlin daemon bug, not a code error. Turning it off costs a little
# rebuild time and makes the build deterministic here. Remove this line if the
# project is ever checked out somewhere without spaces.
kotlin.incremental=false

# Parallel configuration and caching also keep absolute paths in their state;
# both misbehave on a spaced path. Same reasoning as above.
org.gradle.parallel=false
org.gradle.caching=false