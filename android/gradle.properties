org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation could not write its caches reliably when the
# project path contained spaces. The folder is now "D:\GitHub-Projects" (no
# spaces), so this workaround is no longer needed and can be removed to
# re-enable incremental builds. Left in place to keep the change conservative.
kotlin.incremental=false

# Parallel configuration and caching also keep absolute paths in their state;
# both misbehave on a spaced path. Same reasoning as above.
org.gradle.parallel=false
org.gradle.caching=false